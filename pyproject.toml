[project]
name = "partwright"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
dependencies = ["partwright-ir", "partwright-geometry", "partwright-context", "partwright-agent", "partwright-api", "partwright-cli", "partwright-evals", "partwright-training"]

[tool.uv.workspace]
members = ["services/ir", "services/geometry", "services/context", "services/agent", "apps/api", "apps/cli", "evals", "training"]

[tool.uv.sources]
partwright-ir = { workspace = true }
partwright-geometry = { workspace = true }
partwright-context = { workspace = true }
partwright-agent = { workspace = true }
partwright-api = { workspace = true }
partwright-cli = { workspace = true }
partwright-evals = { workspace = true }
partwright-training = { workspace = true }

[dependency-groups]
dev = ["pytest", "ruff", "mypy", "import-linter", "trimesh", "types-pyyaml"]

[tool.ruff]
line-length = 140
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF", "PT", "N"]
ignore = ["PT018"]

[tool.ruff.lint.per-file-ignores]
"**/prompts.py" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["partwright_ir", "partwright_geometry", "partwright_context", "partwright_agent", "partwright_api", "partwright_cli", "partwright_evals", "partwright_training"]

[tool.mypy]
strict = true
python_version = "3.12"
plugins = ["pydantic.mypy"]
mypy_path = ["services/ir/src", "services/geometry/src", "services/context/src", "services/agent/src", "apps/api/src", "apps/cli/src", "evals/src", "training/src"]
explicit_package_bases = true
exclude = ["evals/results/", "out/"]
untyped_calls_exclude = ["trimesh"]

[[tool.mypy.overrides]]
module = ["build123d.*", "OCP.*", "trimesh.*", "ollama.*", "pypdfium2.*", "openpyxl.*", "networkx.*", "sqlite_vec.*", "pyrender.*", "scipy.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["services", "apps", "evals", "training"]
addopts = "--import-mode=importlib"
markers = ["llm: needs a running Ollama with the CI model"]

[tool.importlinter]
root_packages = ["partwright_ir", "partwright_geometry", "partwright_context", "partwright_agent", "partwright_api", "partwright_cli", "partwright_evals", "partwright_training"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Service layering"
type = "layers"
layers = ["partwright_evals | partwright_training", "partwright_cli", "partwright_api", "partwright_agent", "partwright_geometry | partwright_context", "partwright_ir"]

[[tool.importlinter.contracts]]
name = "Kernel stays inside geometry"
type = "forbidden"
source_modules = ["partwright_ir", "partwright_agent", "partwright_api", "partwright_cli", "partwright_evals", "partwright_training"]
forbidden_modules = ["build123d", "OCP"]

[[tool.importlinter.contracts]]
name = "Model runtime stays behind the agent's LLM interface"
type = "forbidden"
source_modules = ["partwright_ir", "partwright_geometry"]
forbidden_modules = ["ollama", "anthropic"]

[[tool.importlinter.contracts]]
name = "Context sees neither geometry, the agent nor the kernel"
type = "forbidden"
source_modules = ["partwright_context"]
forbidden_modules = ["partwright_geometry", "partwright_agent", "build123d", "OCP"]
