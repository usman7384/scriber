llm:
  host: http://127.0.0.1:11434
  # fine-tuned for the IR: install it from huggingface.co/usman7384/scriber-ir-4b-s3-GGUF (README) or rebuild it (training/); without it use --model qwen3.5:4b
  default: scriber-ir:4b-s3
  ci: qwen3.5:0.8b-q8_0
  # requests with images (sketch, photo, drawing, critic) go here; the default has no vision projector
  vision: qwen3.5:4b
  models:
    qwen3.5:4b: {num_ctx: 16384, think: false}
    qwen3.5:0.8b-q8_0: {num_ctx: 8192, think: false}
    scriber-ir:0.8b-s0b: {num_ctx: 8192, think: false, few_shot: false}
    scriber-ir:0.8b-s1: {num_ctx: 8192, think: false, few_shot: false}
    scriber-ir:4b-s1: {num_ctx: 16384, think: false, few_shot: false}
    scriber-ir:4b-s2: {num_ctx: 16384, think: false, few_shot: false}
    scriber-ir:4b-s3: {num_ctx: 16384, think: false, few_shot: false}
    scriber-ir:0.8b-cx13: {num_ctx: 8192, think: false, few_shot: false}
    qwen2.5-coder:7b-instruct-q4_K_M: {num_ctx: 8192}
    # hosted reference models for comparison runs only (need ANTHROPIC_API_KEY or `ant auth login`; never the default)
    claude-sonnet-5-5: {provider: anthropic}
    claude-opus-5-5: {provider: anthropic}
    claude-fable-5-1: {provider: anthropic}
    claude-fable-5-2: {provider: anthropic}
    # OpenAI-compatible APIs, also for comparison runs only; the key is read from the named environment variable
    gemini-3.8-flash: {provider: openai, base_url: "https://generativelanguage.googleapis.com/v1beta/openai", api_key_env: GEMINI_API_KEY}
    gemini-3.1-pro-preview: {provider: openai, base_url: "https://generativelanguage.googleapis.com/v1beta/openai", api_key_env: GEMINI_API_KEY}
    gemini-3.7-flash: {provider: openai, base_url: "https://generativelanguage.googleapis.com/v1beta/openai", api_key_env: GEMINI_API_KEY}
    gemini-2.5-flash: {provider: openai, base_url: "https://generativelanguage.googleapis.com/v1beta/openai", api_key_env: GEMINI_API_KEY}
embeddings:
  model: qwen3-embedding:0.6b
agent:
  max_repairs: 5
  seed: 0
geometry:
  # a full car assembly (40+ parts, lofted bodies) builds in about 75 s, and interference checks grow with the square of the part count
  timeout_s: 600
api:
  host: 127.0.0.1
  port: 8000
  auth: none
output_dir: out
data_dir: data
