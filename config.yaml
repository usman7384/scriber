llm:
  host: http://127.0.0.1:11434
  # built locally, not pulled (D-027, D-036; rebuild steps in docs/agents/training.md); without it use --model qwen3.5:4b
  default: partwright-ir:4b-s3
  ci: qwen3.5:0.8b-q8_0
  # requests with images (sketch, photo, drawing, critic) go here; the default has no vision projector (D-027)
  vision: qwen3.5:4b
  models:
    qwen3.5:4b: {num_ctx: 16384, think: false}
    qwen3.5:0.8b-q8_0: {num_ctx: 8192, think: false}
    partwright-ir:0.8b-s0b: {num_ctx: 8192, think: false, few_shot: false}
    partwright-ir:0.8b-s1: {num_ctx: 8192, think: false, few_shot: false}
    partwright-ir:4b-s1: {num_ctx: 16384, think: false, few_shot: false}
    partwright-ir:4b-s2: {num_ctx: 16384, think: false, few_shot: false}
    partwright-ir:4b-s3: {num_ctx: 16384, think: false, few_shot: false}
    partwright-ir:0.8b-cx13: {num_ctx: 8192, think: false, few_shot: false}
    qwen2.5-coder:7b-instruct-q4_K_M: {num_ctx: 8192}
    # hosted reference models for comparison runs only (need ANTHROPIC_API_KEY or `ant auth login`; never the default)
    claude-sonnet-5-5: {provider: anthropic, effort: high}
    claude-opus-5-5: {provider: anthropic, effort: high}
    claude-fable-5-1: {provider: anthropic, effort: high}
embeddings:
  model: qwen3-embedding:0.6b
agent:
  max_repairs: 5
  seed: 0
geometry:
  timeout_s: 120
api:
  host: 127.0.0.1
  port: 8000
  auth: none
output_dir: out
data_dir: data
