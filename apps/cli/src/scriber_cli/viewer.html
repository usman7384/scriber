<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scriber Viewer</title>
<style>
  :root { --bg: #f4f5f7; --panel: #ffffff; --text: #1c1f24; --muted: #5b6270; --line: #d9dce1; --accent: #2f6fdb; }
  @media (prefers-color-scheme: dark) { :root { --bg: #15171b; --panel: #1f2228; --text: #e8eaee; --muted: #9aa1ad; --line: #343842; --accent: #6b9bff; } }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 14px/1.4 system-ui, sans-serif; }
  #bar { position: absolute; top: 12px; left: 12px; right: 12px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap;
         background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; z-index: 1; }
  select { font: inherit; padding: 4px 8px; border-radius: 6px; border: 1px solid var(--line); background: var(--bg); color: var(--text); }
  #dims { color: var(--muted); font-variant-numeric: tabular-nums; }
  label { color: var(--muted); display: flex; gap: 4px; align-items: center; }
  canvas { display: block; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="bar">
  <select id="pick"></select>
  <span id="dims"></span>
  <label><input type="checkbox" id="edges" checked> edges</label>
</div>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";

const MODELS = await (await fetch("models.json")).json();
const dark = matchMedia("(prefers-color-scheme: dark)").matches;
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(devicePixelRatio);
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(dark ? 0x15171b : 0xf4f5f7);
const camera = new THREE.PerspectiveCamera(40, 1, 0.0001, 100);
const controls = new OrbitControls(camera, renderer.domElement);
scene.add(new THREE.HemisphereLight(0xffffff, 0x666677, 2.2));
const sun = new THREE.DirectionalLight(0xffffff, 1.6);
scene.add(sun);
const material = new THREE.MeshStandardMaterial({ color: 0x9aa6b8, metalness: 0.35, roughness: 0.45 });
const edgeMaterial = new THREE.LineBasicMaterial({ color: dark ? 0x0b0c0f : 0x2a2e36 });
let current = null;

const pick = document.getElementById("pick");
for (const m of MODELS) pick.add(new Option(m, m));
pick.onchange = () => load(pick.value);
document.getElementById("edges").onchange = (e) => current?.traverse((o) => { if (o.isLineSegments) o.visible = e.target.checked; });

function load(name) {
  new GLTFLoader().load(`model/${name}`, (gltf) => {
    if (current) scene.remove(current);
    current = gltf.scene;
    const meshes = [];
    current.traverse((o) => { if (o.isMesh) meshes.push(o); });
    for (const o of meshes) {
      o.material = material;
      const edges = new THREE.LineSegments(new THREE.EdgesGeometry(o.geometry, 25), edgeMaterial);
      edges.visible = document.getElementById("edges").checked;
      o.add(edges);
    }
    scene.add(current);
    const box = new THREE.Box3().setFromObject(current);
    const size = box.getSize(new THREE.Vector3()), center = box.getCenter(new THREE.Vector3());
    const mm = size.clone().multiplyScalar(1000);
    document.getElementById("dims").textContent = `${mm.x.toFixed(1)} × ${mm.z.toFixed(1)} × ${mm.y.toFixed(1)} mm`;
    const r = size.length();
    controls.target.copy(center);
    camera.position.copy(center).add(new THREE.Vector3(0.9, 0.8, 1.1).multiplyScalar(r));
    camera.near = r / 1000; camera.far = r * 100; camera.updateProjectionMatrix();
    sun.position.copy(center).add(new THREE.Vector3(1, 2, 1.5).multiplyScalar(r));
  });
}

function resize() {
  renderer.setSize(innerWidth, innerHeight);
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
}
addEventListener("resize", resize);
resize();
if (MODELS.length) load(MODELS[0]);
else document.getElementById("dims").textContent = "no built models found";
renderer.setAnimationLoop(() => { controls.update(); renderer.render(scene, camera); });
</script>
</body>
</html>
