[project]
name = "partwright-cli"
version = "0.1.0"
description = "Command-line interface"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
dependencies = ["partwright-ir", "partwright-geometry", "partwright-context", "partwright-agent", "pyyaml"]

[project.scripts]
partwright = "partwright_cli.main:main"

[build-system]
requires = ["uv_build>=0.9.13,<0.10.0"]
build-backend = "uv_build"

[tool.uv.sources]
partwright-ir = { workspace = true }
partwright-geometry = { workspace = true }
partwright-context = { workspace = true }
partwright-agent = { workspace = true }
