[project]
name = "scriber-api"
version = "0.1.0"
description = "HTTP API: projects, context, jobs, versions, shares and webhooks"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
dependencies = [
    "scriber-ir",
    "scriber-geometry",
    "scriber-context",
    "scriber-agent",
    "fastapi==0.162.0",
    "uvicorn==0.54.0",
    "sse-starlette==3.5.1",
    "python-multipart==0.0.32",
    "structlog==26.1.0",
    "httpx==0.28.1",
    "sqlalchemy==2.1.6",
]

[build-system]
requires = ["uv_build>=0.9.13,<0.10.0"]
build-backend = "uv_build"

[tool.uv.sources]
scriber-ir = { workspace = true }
scriber-geometry = { workspace = true }
scriber-context = { workspace = true }
scriber-agent = { workspace = true }
