[project]
name = "partwright-context"
version = "0.1.0"
description = "Engineering file ingestion, fact and rule extraction, project knowledge graph and retrieval"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
dependencies = [
    "partwright-ir",
    "pydantic==2.14.1",
    "pypdfium2==5.14.0",
    "pdfplumber==0.11.10",
    "python-docx==1.2.0",
    "openpyxl==3.1.5",
    "pyyaml==6.0.3",
    "pint==0.26.2",
    "networkx==3.7",
    "sqlalchemy==2.1.6",
    "sqlite-vec==0.1.9",
    "ollama==0.6.3",
]

[build-system]
requires = ["uv_build>=0.9.13,<0.10.0"]
build-backend = "uv_build"

[tool.uv.sources]
partwright-ir = { workspace = true }
