[project]
name = "partwright-agent"
version = "0.1.0"
description = "Design agent loop: intent, IR emission, checks, repair"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
dependencies = ["partwright-ir", "partwright-geometry", "partwright-context", "ollama==0.6.3"]

[build-system]
requires = ["uv_build>=0.9.13,<0.10.0"]
build-backend = "uv_build"

[tool.uv.sources]
partwright-ir = { workspace = true }
partwright-geometry = { workspace = true }
partwright-context = { workspace = true }
partwright-agent = { workspace = true }
