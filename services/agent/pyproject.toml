[project]
name = "scriber-agent"
version = "0.1.0"
description = "Design agent loop: intent, IR emission, checks, repair"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
dependencies = [
    "scriber-ir",
    "scriber-geometry",
    "scriber-context",
    "ollama==0.6.3",
    "anthropic==2.3.0",
]

[build-system]
requires = ["uv_build>=0.9.13,<0.10.0"]
build-backend = "uv_build"

[tool.uv.sources]
scriber-ir = { workspace = true }
scriber-geometry = { workspace = true }
scriber-context = { workspace = true }
scriber-agent = { workspace = true }
