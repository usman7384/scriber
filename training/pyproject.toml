[project]
name = "scriber-training"
version = "0.1.0"
description = "Verified synthetic IR data for fine-tuning"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
dependencies = ["scriber-ir", "scriber-geometry", "scriber-agent", "scriber-cli", "pyyaml"]

[project.scripts]
scriber-dataset = "scriber_training.dataset:main"
scriber-collect = "scriber_training.collect:main"
scriber-conventions = "scriber_training.conventions:main"

[build-system]
requires = ["uv_build>=0.9.13,<0.10.0"]
build-backend = "uv_build"

[tool.uv.sources]
scriber-ir = { workspace = true }
scriber-geometry = { workspace = true }
scriber-agent = { workspace = true }
scriber-cli = { workspace = true }
