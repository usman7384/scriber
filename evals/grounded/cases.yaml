    - {kind: parameter, value: 150}
  rules: []

- id: g10-fdm-bracket
  rows: [VM-3, IN-13]
  request: 3D-printed mounting plate per the spec
  process: fdm
  checks:
    - {kind: extent, description: length 70, value: 70}
    - {kind: extent, description: width 40, value: 40}
    - {kind: extent, description: thickness 4, value: 4}
    - {kind: holes, description: two M4 clearance, count: 2, diameter_min: 4.3, diameter_max: 4.8}
    - {kind: hole_spacing, description: 50 apart, value: 50, diameter_min: 4.3, diameter_max: 4.8}
  facts:
    - {kind: parameter, value: 70}
    - {kind: parameter, value: 40}
    - {kind: parameter, value: 4}
    - {kind: holes, value: 4, count: 2}
    - {kind: parameter, value: 50}
  rules:
    - {kind: max_overhang_angle, value: 45}
    - {kind: min_hole_edge_ratio, value: 2}
