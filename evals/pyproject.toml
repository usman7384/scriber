[project]
name = "scriber-evals"
version = "0.1.0"
description = "Benchmark specs, harness and scorecard"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
dependencies = [
    "scriber-ir",
    "scriber-geometry",
    "scriber-context",
    "scriber-agent",
    "scriber-api",
    "scriber-cli",
    "pyyaml",
    "trimesh==5.2.0",
]

[project.scripts]
scriber-evals = "scriber_evals.run:main"
scriber-grounded = "scriber_evals.grounded:main"
scriber-parity = "scriber_evals.parity:main"
scriber-parity-report = "scriber_evals.parity_report:main"

[build-system]
requires = ["uv_build>=0.9.13,<0.10.0"]
build-backend = "uv_build"

[tool.uv.sources]
scriber-ir = { workspace = true }
scriber-geometry = { workspace = true }
scriber-context = { workspace = true }
scriber-agent = { workspace = true }
scriber-api = { workspace = true }
scriber-cli = { workspace = true }
