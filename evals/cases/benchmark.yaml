    - {kind: extent, description: length 12, value: 12}
    - {kind: holes, description: one 10.5 bore, count: 1, diameter_min: 10.4, diameter_max: 10.6}
    - {kind: wall, description: wall 9.75, value: 9.75, tolerance: 0.05}

- id: b03-square-tube
  rows: [GE-8, VM-8]
