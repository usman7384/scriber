    - {kind: extent, description: length 100, value: 100}
    - {kind: holes, description: two 6.5 cross holes, count: 2, diameter_min: 6.4, diameter_max: 6.6}
    - {kind: hole_spacing, description: cross holes 60 apart, value: 60, diameter_min: 6.4, diameter_max: 6.6}

- id: b04-bolt-disc
