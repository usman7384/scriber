# Spec-driven benchmark (GE-8, VM-8): our own wording; each case has a hand-built reference design in evals/parity/m5/reference/.
- id: b01-cover-plate
  rows: [GE-8, VM-8]
  prompt: Rectangular cover plate 140 by 90 mm, 6 mm thick, with a 9 mm hole 10 mm in from each corner.
  checks:
    - {kind: extent, description: length 140, value: 140}
    - {kind: extent, description: width 90, value: 90}
    - {kind: extent, description: thickness 6, value: 6}
    - {kind: holes, description: four 9 mm holes, count: 4, diameter_min: 8.9, diameter_max: 9.1}
    - {kind: hole_spacing, description: holes 120 apart, value: 120, diameter_min: 8.9, diameter_max: 9.1}
    - {kind: hole_spacing, description: holes 70 apart, value: 70, diameter_min: 8.9, diameter_max: 9.1}

- id: b02-round-spacer
  rows: [GE-8, VM-8]
  prompt: Round spacer, 30 mm across and 12 mm long, with a 10.5 mm clearance bore down its axis.
  checks:
