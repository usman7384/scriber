# DP-18 context-file parts: each prompt is our own spec document for the named part
- id: dp18-kmm-28
  rows: [DP-18]
  prompt: |
    KMM-28 motor mount, spec rev A
    Purpose: carries a 28 mm brushless outrunner on the airframe.
    - Base plate 40 x 40 mm, 4 mm thick, PETG.
    - Frame fixing: four 3.4 mm holes for M3 on a 32 x 32 mm square.
    - Motor fixing: four 3.2 mm holes for M3, one pair 19 mm apart along X and one pair 16 mm apart along Y, centred on the plate.
    - Centre hole 10 mm for the shaft circlip.
  checks:
    - {kind: extent, description: plate 40, value: 40}
    - {kind: extent, description: thickness 4, value: 4}
    - {kind: holes, description: four frame holes 3.4, count: 4, diameter_min: 3.35, diameter_max: 3.45}
    - {kind: hole_spacing, description: frame square 32, value: 32, diameter_min: 3.35, diameter_max: 3.45}
    - {kind: holes, description: four motor holes 3.2, count: 4, diameter_min: 3.15, diameter_max: 3.25}
    - {kind: hole_spacing, description: motor pair 19, value: 19, diameter_min: 3.15, diameter_max: 3.25}
    - {kind: hole_spacing, description: motor pair 16, value: 16, diameter_min: 3.15, diameter_max: 3.25}
    - {kind: holes, description: centre hole 10, count: 1, diameter_min: 9.9, diameter_max: 10.1}

- id: dp18-kmp-30
  rows: [DP-18]
  prompt: |
    KMP-30 motor plate, spec rev B
    Purpose: adapter plate between a 30 mm motor and a square tube arm.
    - Plate 50 x 50 x 3 mm, 6061 aluminium.
    - Centre hole 12 mm.
    - Motor: four 3.2 mm holes equally spaced on a 25 mm bolt circle.
