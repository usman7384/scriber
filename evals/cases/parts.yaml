# Demo-part rows (M5). Our own wording; the demos in partwright_evals.parity_m5_parts add the row-specific geometry checks.
- id: dp1-quad-frame
  rows: [DP-1]
  prompt: 5-inch X quad frame, 4 mm carbon plate, 16x16 M2 FC mount, M3 motor mounts 16/19 mm
  checks:
    - {kind: extent, description: plate 4 thick, value: 4}
    - {kind: holes, description: four M2 FC holes, count: 4, diameter_min: 2.1, diameter_max: 2.6}
    - {kind: hole_spacing, description: FC square 16, value: 16, tolerance: 0.05, diameter_min: 2.1, diameter_max: 2.6}
    - {kind: holes, description: sixteen M3 motor holes, count: 16, diameter_min: 3.1, diameter_max: 3.6}
    - {kind: hole_spacing, description: motor holes 16 apart, value: 16, tolerance: 0.05, diameter_min: 3.1, diameter_max: 3.6}
    - {kind: hole_spacing, description: motor holes 19 apart, value: 19, tolerance: 0.05, diameter_min: 3.1, diameter_max: 3.6}

