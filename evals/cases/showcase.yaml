- id: sc10-hinge
  rows: [M6-SHOWCASE]
  prompt: "Butt hinge: two 40 x 30 x 3 mm leaves joined by three 8 mm knuckles on a 4 mm pin with a 7 mm head, 4.2 mm pin holes, and two 4.5 mm countersunk screw holes in each leaf; expose leaf_length, knuckle_diameter and pin_diameter as parameters."
  checks:
    - {kind: extent, description: open width 60, value: 60}
    - {kind: extent, description: knuckle diameter 8, value: 8}
    - {kind: holes, description: four countersunk screw holes, count: 4, diameter_min: 4.4, diameter_max: 4.6}
    - {kind: min_holes, description: pin holes in the knuckles, count: 1, diameter_min: 4.1, diameter_max: 4.3}
  shape:
