# M6 showcase benchmark: one-line prompts for recognisable parts and small assemblies. Our own wording.
# Reference designs: evals/parity/m6/reference/<id>.json; the gate is partwright_evals.parity_m6 (M6-SHOWCASE).
- id: sc01-gear-pair
  rows: [M6-SHOWCASE]
  prompt: "Spur gear pair, module 2: a 20-tooth pinion and a 40-tooth wheel, both 12 mm wide with 8 mm bores, meshing at the correct centre distance; expose module, pinion_teeth and wheel_teeth as parameters."
  checks:
    - {kind: holes, description: two 8 mm bores, count: 2, diameter_min: 7.9, diameter_max: 8.1}
    - {kind: hole_spacing, description: centre distance 60, value: 60, diameter_min: 7.9, diameter_max: 8.1}
    - {kind: extent, description: face width 12, value: 12}
    - {kind: extent, description: overall length 124, value: 124}
  shape:
    - {kind: teeth, description: 20-tooth pinion with a 44 tip diameter, count: 20, value: 44}
    - {kind: teeth, description: 40-tooth wheel with an 84 tip diameter, count: 40, value: 84}
    - {kind: parts, description: two gears, count: 2}
    - {kind: mates, description: one mesh joint without interference, count: 1}
  params: [module, pinion_teeth, wheel_teeth]

- id: sc02-vbelt-pulley
  rows: [M6-SHOWCASE]
  prompt: "V-belt pulley, 90 mm outside diameter and 28 mm wide, with two 38 degree V grooves 12 mm apart, each 9.7 mm wide at the rim and 11 mm deep, a 16 mm bore and a 32 mm hub standing 10 mm off one face; expose outside_diameter, groove_angle and bore as parameters."
  checks:
    - {kind: extent, description: outside diameter 90, value: 90}
    - {kind: extent, description: length over the hub 38, value: 38}
    - {kind: holes, description: one 16 mm bore, count: 1, diameter_min: 15.9, diameter_max: 16.1}
  params: [outside_diameter, groove_angle, bore]

- id: sc03-keyed-shaft
  rows: [M6-SHOWCASE]
  prompt: "Stepped shaft 180 mm long: a 25 mm middle section 120 mm long between two 20 mm journals 30 mm long, a DIN 6885 keyway 40 mm long centred on the middle section, and a 1.3 mm wide, 0.5 mm deep circlip groove 5 mm from each end; expose shaft_diameter, journal_diameter and keyway_length as parameters."
  checks:
    - {kind: extent, description: length 180, value: 180}
    - {kind: extent, description: middle diameter 25, value: 25}
  params: [shaft_diameter, journal_diameter, keyway_length]

- id: sc04-pillow-block
  rows: [M6-SHOWCASE]
  prompt: "Pillow block housing for a 52 mm bearing: a 130 x 38 x 15 mm base with two 11 mm bolt holes 100 mm apart, an 80 mm round housing on a 40 mm shaft centre height, and a 52 mm bore through it; expose centre_height, bearing_diameter and bolt_spacing as parameters."
  checks:
    - {kind: extent, description: base length 130, value: 130}
    - {kind: extent, description: width 38, value: 38}
    - {kind: extent, description: height 80, value: 80}
    - {kind: holes, description: one 52 mm bearing bore, count: 1, diameter_min: 51.9, diameter_max: 52.1}
    - {kind: holes, description: two 11 mm bolt holes, count: 2, diameter_min: 10.9, diameter_max: 11.1}
    - {kind: hole_spacing, description: bolt holes 100 apart, value: 100, diameter_min: 10.9, diameter_max: 11.1}
  params: [centre_height, bearing_diameter, bolt_spacing]

- id: sc05-gearbox-housing
  rows: [M6-SHOWCASE]
  prompt: "Gearbox housing with a bolted lid: a 160 x 120 x 80 mm open box with 6 mm walls and floor, M5 screw bosses in the four corners, a 6 mm lid with a 5 mm locating lip, two 60 mm bearing bosses standing 10 mm out of the front wall at 70 mm centres with 47 mm bores, and a 6 mm rib under each boss; expose wall, boss_spacing and bearing_bore as parameters."
  checks:
    - {kind: extent, description: length 160, value: 160}
    - {kind: extent, description: height with the lid 86, value: 86}
    - {kind: holes, description: two 47 mm bearing bores, count: 2, diameter_min: 46.9, diameter_max: 47.1}
    - {kind: hole_spacing, description: bearing centres 70 apart, value: 70, diameter_min: 46.9, diameter_max: 47.1}
    - {kind: holes, description: four M5 clearance holes in the lid, count: 4, diameter_min: 5.3, diameter_max: 5.8}
  shape:
    - {kind: parts, description: box and lid, count: 2}
    - {kind: mates, description: lid seated on the box, count: 1}
  params: [wall, boss_spacing, bearing_bore]

- id: sc06-nema17-mount
  rows: [M6-SHOWCASE]
  prompt: "NEMA 17 motor mount, a 5 mm thick L bracket: a 60 x 60 mm upright face with a 23 mm pilot hole and four 3.4 mm holes on a 31 mm square, and a 60 x 50 mm base with two 5.5 mm holes 40 mm apart and a 30 x 8 mm belt slot; expose thickness, motor_hole_spacing and slot_length as parameters."
  checks:
    - {kind: extent, description: width 60, value: 60}
    - {kind: extent, description: base depth 50, value: 50}
    - {kind: holes, description: one 23 mm pilot hole, count: 1, diameter_min: 22.9, diameter_max: 23.1}
    - {kind: holes, description: four motor holes, count: 4, diameter_min: 3.3, diameter_max: 3.5}
    - {kind: hole_spacing, description: motor square 31, value: 31, diameter_min: 3.3, diameter_max: 3.5}
    - {kind: holes, description: two base holes, count: 2, diameter_min: 5.4, diameter_max: 5.6}
    - {kind: hole_spacing, description: base holes 40 apart, value: 40, diameter_min: 5.4, diameter_max: 5.6}
  params: [thickness, motor_hole_spacing, slot_length]

- id: sc07-camera-mount
  rows: [M6-SHOWCASE]
  prompt: "Camera mount block 60 x 40 x 12 mm with a 1/4-20 tripod thread in the centre of the bottom (5.1 mm tap drill, 10 mm deep) and two 4.5 mm clearance holes 48 mm apart through the top; expose thickness, thread_depth and mount_hole_spacing as parameters."
  checks:
    - {kind: extent, description: length 60, value: 60}
    - {kind: extent, description: width 40, value: 40}
    - {kind: extent, description: thickness 12, value: 12}
    - {kind: holes, description: one tripod tap drill, count: 1, diameter_min: 5.0, diameter_max: 5.2}
    - {kind: holes, description: two clearance holes, count: 2, diameter_min: 4.4, diameter_max: 4.6}
    - {kind: hole_spacing, description: clearance holes 48 apart, value: 48, diameter_min: 4.4, diameter_max: 4.6}
  params: [thickness, thread_depth, mount_hole_spacing]

- id: sc08-gripper-finger
  rows: [M6-SHOWCASE]
