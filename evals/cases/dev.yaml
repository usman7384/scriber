# Dev set for picking S2 checkpoints (D-028). Hand-written, never trained on; M1 and grounded stay the gates.
- id: d01-cover-plate
  rows: [DEV]
  prompt: Cover plate 150 x 100 x 4 mm with six 5.5 mm holes, three along each long edge, 10 mm in from the edges, 65 mm pitch.
  checks:
    - {kind: extent, description: length 150, value: 150}
    - {kind: extent, description: width 100, value: 100}
    - {kind: extent, description: thickness 4, value: 4}
    - {kind: holes, description: six 5.5 holes, count: 6, diameter_min: 5.4, diameter_max: 5.6}
    - {kind: hole_spacing, description: pitch 65, value: 65, diameter_min: 5.4, diameter_max: 5.6}
    - {kind: hole_spacing, description: rows 80 apart, value: 80, diameter_min: 5.4, diameter_max: 5.6}

